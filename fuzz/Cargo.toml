[package]
name = "rust-pdf-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.rust-pdf]
path = ".."
default-features = false
# `native-render` (pure-Rust content-stream interpreter/rasterizer, no
# native/FFI dependency) is needed by the `render_interpreter` target;
# pulling it in here does not change the other targets' behavior (Cargo
# feature unification is additive within one crate's dependency graph).
features = ["parser", "fonts", "native-render"]

[[bin]]
name = "parse_pdf"
path = "fuzz_targets/parse_pdf.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_inline_image"
path = "fuzz_targets/parse_inline_image.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_filters"
path = "fuzz_targets/decode_filters.rs"
test = false
doc = false
bench = false

[[bin]]
name = "font_load"
path = "fuzz_targets/font_load.rs"
test = false
doc = false
bench = false

[[bin]]
name = "render_interpreter"
path = "fuzz_targets/render_interpreter.rs"
test = false
doc = false
bench = false
