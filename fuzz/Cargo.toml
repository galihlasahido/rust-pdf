[package]
name = "rust-pdf-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.rust-pdf]
path = ".."
default-features = false
features = ["parser"]

[[bin]]
name = "parse_pdf"
path = "fuzz_targets/parse_pdf.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_inline_image"
path = "fuzz_targets/parse_inline_image.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_filters"
path = "fuzz_targets/decode_filters.rs"
test = false
doc = false
bench = false
