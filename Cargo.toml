[package]
name = "rust-pdf"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "cdylib"]  # rlib for Rust, cdylib for C/FFI

[features]
default = []
compression = ["flate2"]
images = ["image", "compression"]
parser = ["nom", "compression", "jpeg-decoder", "dep:memmap2"]
encryption = ["aes", "cbc", "sha2", "md-5", "rand", "zeroize"]
signatures = ["encryption", "cms", "x509-cert", "rsa", "p256", "ecdsa", "const-oid", "der", "spki", "pkcs8", "signature"]
html = []
office = []
# Embedded TrueType/OpenType font loading (ttf-parser), Type0/CID composite
# fonts, and font subsetting (subsetter) for PDF generation. See
# src/font/truetype.rs and src/font/subset.rs.
fonts = ["dep:ttf-parser", "dep:subsetter"]
full = ["compression", "images", "parser", "encryption", "signatures", "html", "office", "fonts"]
# Pure-Rust content-stream interpreter and 2D rasterizer (no native/FFI
# dependency at all): graphics-state stack, path construction/painting,
# clipping, ExtGState (alpha/line width/dash/blend mode/soft mask),
# DeviceGray/RGB/CMYK/Indexed/Separation/DeviceN/ICCBased-approximated
# color, text showing (TrueType/OpenType simple + CID/Type0 fonts via
# `fonts`'s `ttf-parser`, plus Type3 glyph procedures), image and Form
# XObjects (including transparency groups and per-image soft masks), and
# blend modes (all 16 standard ISO 32000-1 §11.3.5 modes). See
# `src/render/native/mod.rs` for the exact scope and its
# explicitly-documented gaps (no JBIG2/JPX, no Type1/bare-CFF font
# programs, no true ICC color management, no Patterns/shadings, group
# isolation/knockout and soft-mask `/BC`/`/TR` are approximated, no
# non-embedded/system font substitution -- all fail closed with a
# structured `NativeRenderError`/`RenderWarning` rather than silently
# mis-rendering). Pulls in `fonts` (ttf-parser) for glyph outline
# extraction -- see `src/render/native/font.rs`. This is the
# lowest-level, single-content-stream entry point
# (`render::native::render_content_stream`); see the `render` feature
# below for the whole-document `PdfRenderer` API built on top of it.
native-render = ["dep:tiny-skia", "parser", "fonts"]
# Whole-document page rasterization (`render::PdfRenderer`): resolves a
# page's effective `/MediaBox`/`/Rotate`/`/Resources`/content streams
# (ISO 32000-1 Table 30, §7.8.3) via this crate's own pure-Rust parser/
# editor (`parser`/`EditableDocument`) and rasterizes them via
# `native-render`'s content-stream interpreter, producing an
# `image::RgbaImage` (hence `images`). No native binary or FFI dependency
# of any kind -- see `src/render/mod.rs` for the (now-completed) migration
# away from an earlier FFI-to-Pdfium design and the compatibility/
# performance trade-offs that migration explicitly accepted.
render = ["native-render", "images"]
# Async Tauri desktop-app command layer (open_document, render_page,
# extract_text, search_text, apply_edit, save_document, fill_form,
# add_annotation, sign_document) plus a dedicated worker thread pool and
# Tauri-event progress reporting. See src/tauri_commands/mod.rs. Requires
# `parser` (structural editing), `render` (rasterization) and
# `signatures` (digital signing), so pulls all three in.
tauri = ["dep:tauri", "dep:tokio", "dep:serde", "parser", "render", "signatures"]

[dependencies]
thiserror = "2.0"
indexmap = "2.0"
bitflags = "2.4"
flate2 = { version = "1.0", optional = true, default-features = false, features = ["rust_backend"] }
image = { version = "0.25", optional = true, default-features = false, features = ["jpeg", "png"] }
nom = { version = "7.1", optional = true }
# Memory-mapped file I/O for `PdfReader::from_file` (see src/parser/mod.rs,
# `DataSource`): lets opening a multi-gigabyte PDF avoid reading the whole
# file into the process heap up front, and lets the OS page cache (not this
# process's private memory) back pages the caller never actually touches.
memmap2 = { version = "0.9", optional = true }
# DCTDecode filter (ISO 32000-1 7.4.8): decodes baseline/progressive JPEG
# stream data embedded in PDF image XObjects.
jpeg-decoder = { version = "0.3", optional = true, default-features = false }
# Encryption dependencies
aes = { version = "0.8", optional = true }
cbc = { version = "0.1", optional = true }
sha2 = { version = "0.10", optional = true }
md-5 = { version = "0.10", optional = true }
rand = { version = "0.8", optional = true }
zeroize = { version = "1.7", optional = true, features = ["derive"] }
# Digital signature dependencies
cms = { version = "0.2", optional = true, features = ["std"] }
x509-cert = { version = "0.2", optional = true, features = ["std", "pem"] }
rsa = { version = "0.9", optional = true, features = ["sha2"] }
p256 = { version = "0.13", optional = true, features = ["ecdsa"] }
ecdsa = { version = "0.16", optional = true }
const-oid = { version = "0.9", optional = true }
der = { version = "0.7", optional = true, features = ["std", "pem", "alloc"] }
spki = { version = "0.7", optional = true, features = ["std"] }
pkcs8 = { version = "0.10", optional = true, features = ["std", "pem"] }
signature = { version = "2.2", optional = true }
# Pure-Rust 2D rasterizer (path fill/stroke, clipping via alpha masks) used
# by the `native-render` feature's content-stream interpreter
# (src/render/native/). No native/FFI dependency: this and its own
# transitive deps (arrayref, arrayvec, bytemuck, cfg-if, log) are all pure
# Rust. `png-format` is disabled -- this crate doesn't need tiny-skia's own
# PNG codec, only its rasterizer.
tiny-skia = { version = "0.12", optional = true, default-features = false, features = ["std"] }
# Embedded TrueType/OpenType font parsing (glyph metrics, cmap, name table).
# We deliberately parse fonts only through this crate rather than hand-rolling
# our own sfnt/OpenType parser over untrusted font bytes (see CLAUDE workflow
# rule: don't reimplement mature C/C++-grade parsers).
ttf-parser = { version = "0.25", optional = true }
# TrueType/OpenType font subsetting (glyf/CFF table rebuilding, glyph
# remapping) for PDF font embedding. `variable-fonts` is disabled: it pulls
# in `skrifa`/`write-fonts`/`kurbo` to support font-variation instancing,
# which this crate does not need (embedded fonts are always instanced to a
# single set of outlines).
subsetter = { version = "0.2", optional = true, default-features = false }
# Desktop-app command layer (feature `tauri`, see src/tauri_commands).
tauri = { version = "2", optional = true }
# Async runtime used only for the oneshot result channel between an async
# Tauri command and this crate's own worker thread pool (src/tauri_commands/worker.rs),
# and for `#[tokio::test]` in that module's own test suite. Tauri itself
# already depends on tokio for its command dispatch, so this adds no new
# runtime to an app that already uses Tauri.
tokio = { version = "1", optional = true, features = ["sync", "rt", "rt-multi-thread", "macros", "time"] }
serde = { version = "1", optional = true, features = ["derive"] }

[dev-dependencies]
lopdf = "0.43.0"
tempfile = "3.0"
# Only exercised by src/tauri_commands's own test suite (feature `tauri`),
# to assert on the JSON shape of `CommandError`/DTOs and to drive
# `#[tokio::test]`s against `tauri::test`'s `MockRuntime`.
serde_json = "1"
